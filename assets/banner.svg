<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
  <title id="t">agent-trust-kit</title>
  <desc id="d">A small shield with a friendly face stamps agents at the gate: a green agent holding its signed network gets ADMIT, a red one gets REFUSE.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="1" stop-color="#06140f"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#0f241c" stroke-width="1"/>
    </pattern>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5BE8AA"/>
      <stop offset="1" stop-color="#22A07A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3DDC97" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#3DDC97" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000000" stop-opacity="1"/>
      <stop offset="0.75" stop-color="#000000" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="16" fill="url(#grid)" opacity="0.9"/>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="16" fill="none" stroke="#3DDC97" stroke-opacity="0.3"/>

  <!-- ground -->
  <line x1="660" y1="250" x2="1170" y2="250" stroke="#1D7A62" stroke-opacity="0.6" stroke-width="2" stroke-dasharray="2 8" stroke-linecap="round"/>

  <!-- waiting agent, holding its signed network -->
  <g transform="translate(700 0)">
    <line x1="27" y1="186" x2="27" y2="172" stroke="#3DDC97" stroke-width="3" stroke-linecap="round"/>
    <circle cx="27" cy="169" r="5" fill="#F5B942"/>
    <rect x="0" y="186" width="54" height="50" rx="16" fill="#132C24" stroke="#3DDC97" stroke-width="3"/>
    <circle cx="18" cy="207" r="4" fill="#EAF5EF"/>
    <circle cx="36" cy="207" r="4" fill="#EAF5EF"/>
    <path d="M20 220 Q27 225 34 220" fill="none" stroke="#EAF5EF" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="10" y="236" width="10" height="12" rx="4" fill="#3DDC97"/>
    <rect x="34" y="236" width="10" height="12" rx="4" fill="#3DDC97"/>
    <!-- the network file with its seal -->
    <g transform="rotate(-8 74 214)">
      <rect x="58" y="194" width="30" height="38" rx="4" fill="#EAF5EF"/>
      <line x1="64" y1="204" x2="82" y2="204" stroke="#8FA89E" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="64" y1="211" x2="78" y2="211" stroke="#8FA89E" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="80" cy="224" r="6" fill="#3DDC97"/>
    </g>
  </g>

  <!-- the mascot: a shield with a stamp -->
  <circle cx="860" cy="160" r="96" fill="url(#glow)"/>
  <path d="M860 82 L922 104 V156 C922 200 896 228 860 242 C824 228 798 200 798 156 V104 Z" fill="url(#shield)" stroke="#0B3B2C" stroke-width="4" stroke-linejoin="round"/>
  <path d="M812 112 L860 95" stroke="#C9FBE4" stroke-opacity="0.7" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="841" cy="152" rx="6" ry="8.5" fill="#06140f"/>
  <ellipse cx="879" cy="152" rx="6" ry="8.5" fill="#06140f"/>
  <circle cx="843" cy="149" r="2.2" fill="#FFFFFF"/>
  <circle cx="881" cy="149" r="2.2" fill="#FFFFFF"/>
  <circle cx="828" cy="172" r="7" fill="#FF6F8E" fill-opacity="0.85"/>
  <circle cx="892" cy="172" r="7" fill="#FF6F8E" fill-opacity="0.85"/>
  <path d="M850 172 Q860 181 870 172" fill="none" stroke="#06140f" stroke-width="3" stroke-linecap="round"/>
  <!-- arm and stamp -->
  <path d="M918 172 Q936 166 944 152" fill="none" stroke="#0B3B2C" stroke-width="6" stroke-linecap="round"/>
  <rect x="936" y="118" width="16" height="26" rx="8" fill="#F5B942" stroke="#0B3B2C" stroke-width="3"/>
  <rect x="926" y="142" width="36" height="12" rx="3" fill="#F5B942" stroke="#0B3B2C" stroke-width="3"/>
  <!-- a little motion spark -->
  <path d="M968 114 l6 -6 M972 126 l9 -2 M960 106 l1 -9" stroke="#F5B942" stroke-width="3" stroke-linecap="round"/>

  <!-- admitted agent -->
  <g transform="translate(990 0)">
    <line x1="27" y1="186" x2="27" y2="172" stroke="#3DDC97" stroke-width="3" stroke-linecap="round"/>
    <circle cx="27" cy="169" r="5" fill="#3DDC97"/>
    <rect x="0" y="186" width="54" height="50" rx="16" fill="#132C24" stroke="#3DDC97" stroke-width="3"/>
    <path d="M13 208 Q18 202 23 208" fill="none" stroke="#EAF5EF" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M31 208 Q36 202 41 208" fill="none" stroke="#EAF5EF" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M18 218 Q27 228 36 218" fill="#EAF5EF"/>
    <rect x="10" y="236" width="10" height="12" rx="4" fill="#3DDC97"/>
    <rect x="34" y="236" width="10" height="12" rx="4" fill="#3DDC97"/>
    <g transform="rotate(-6 27 132)">
      <rect x="-12" y="118" width="78" height="28" rx="6" fill="#06140f" stroke="#3DDC97" stroke-width="2.5"/>
      <path d="M-2 132 l5 5 l9 -10" fill="none" stroke="#3DDC97" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="16" y="138" fill="#3DDC97" font-family="'Cascadia Code', 'SF Mono', Consolas, Menlo, monospace" font-size="15" font-weight="700" letter-spacing="1">ADMIT</text>
    </g>
    <path d="M-10 172 l0 -10 M-15 167 l10 0" stroke="#3DDC97" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- refused agent -->
  <g transform="translate(1094 8)">
    <line x1="27" y1="186" x2="31" y2="174" stroke="#FF5C7A" stroke-width="3" stroke-linecap="round"/>
    <circle cx="32" cy="171" r="5" fill="#FF5C7A"/>
    <rect x="0" y="186" width="54" height="42" rx="16" fill="#2A1218" stroke="#FF5C7A" stroke-width="3"/>
    <path d="M14 202 l8 4 M40 202 l-8 4" stroke="#EAF5EF" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M20 218 Q27 212 34 218" fill="none" stroke="#EAF5EF" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="10" y="228" width="10" height="12" rx="4" fill="#FF5C7A"/>
    <rect x="34" y="228" width="10" height="12" rx="4" fill="#FF5C7A"/>
    <g transform="rotate(5 27 132)">
      <rect x="-16" y="118" width="86" height="28" rx="6" fill="#06140f" stroke="#FF5C7A" stroke-width="2.5"/>
      <path d="M-6 127 l9 9 M3 127 l-9 9" stroke="#FF5C7A" stroke-width="3" stroke-linecap="round"/>
      <text x="10" y="138" fill="#FF5C7A" font-family="'Cascadia Code', 'SF Mono', Consolas, Menlo, monospace" font-size="15" font-weight="700" letter-spacing="1">REFUSE</text>
    </g>
  </g>

  <rect width="700" height="300" fill="url(#fade)"/>

  <g font-family="'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif">
    <text x="56" y="78" fill="#8FA89E" font-size="15" font-weight="600" letter-spacing="3">SIGN · TEST · ADMIT · RECEIPT</text>
    <text x="54" y="138" fill="#EAF5EF" font-family="'Cascadia Code', 'SF Mono', Consolas, Menlo, monospace" font-size="50" font-weight="700">agent-trust-kit</text>
    <text x="56" y="184" fill="#B9CCC3" font-size="21">The trust layer for agents on the open agentic web,</text>
    <text x="56" y="212" fill="#B9CCC3" font-size="21">checked <tspan fill="#3DDC97" font-weight="700">before</tspan> they transact.</text>
    <text x="56" y="256" fill="#6E8A7F" font-size="15" letter-spacing="1">browser · Node 22 · Cloudflare Workers  —  no new cryptography</text>
  </g>
</svg>
